[workspace]
authors = [
  "Joseph D. Chipperfield <joseph.chipperfield@nina.no>",
  "Robert Lewis <robert.lewis@nina.no>",
  "Trond Simensen <trond.simensen@nina.no>",
  "Adam Klimes <adam.klimes@ibot.cas.cz>",
  "Liv Guri Velle <liv.guri.velle@nibio.no>",
  "Vigdis Vandvik <vigdis.vandvik@uib.no>",
  "Joachim Topper <joachim.topper@nina.no>",
]
channels = ["conda-forge"]
name = "ecomapr"
platforms = ["linux-64", 'win-64']
version = "0.0.1"

[tasks]
Rscript = "Rscript"
radian = "radian"
setup-r-dependencies = "Rscript scripts/install-r-dependencies.R"

[dependencies]
r-base = ">=4.5.2,<4.6"
r-languageserver = ">=0.3.16,<0.4"
radian = ">=0.6.15,<0.7"
r-httpgd = ">=2.0.4,<3"
prek = ">=0.3.2,<0.4"
r-sf = ">=1.1_3,<2"
r-ggplot2 = ">=4.0.3,<5"
r-future = ">=1.82.0,<2"
r-taxize = ">=0.10.1,<0.11"
r-gridextra = ">=2.3.1,<3"
r-jsonlite = ">=2.0.0,<3"
r-parallelly = ">=1.50.0,<2"
r-rgbif = ">=3.9.0,<4"
r-biocmanager = ">=1.30.27,<2"
r-devtools = ">=2.5.2,<3"
r-knitr = ">=1.52,<2"
r-rmarkdown = ">=2.32,<3"
r-rcpp = ">=1.1.2,<2"
graphviz = ">=14.1.2,<15"

[activation.env]
R_HOME = "$CONDA_PREFIX/lib/R"
PIXI_R_LIBS = "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"

[target.linux-64.dependencies]
r-terra = ">=1.9_50,<2"
